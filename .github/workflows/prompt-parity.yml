# The lecture prompt lives here AND in syllabus-accounts, and has drifted twice.
#
# Deliberately NOT on pull_request. A prompt reword has to land in both repos,
# and they cannot land at the same instant: whichever PR is open first sees the
# other repo's main still carrying the old text and goes red. Required on both
# sides, that is a deadlock with no legal order. So this runs AFTER a change
# lands, on a schedule to catch the other repo moving underneath us, and by
# hand. It reports; it does not gate.
#
# It is not redundant with the copy in syllabus-accounts. That one only runs
# when syllabus-accounts is pushed, so it structurally cannot see a reword made
# here. This covers exactly that case.
name: Prompt parity

on:
  push:
    branches: [main]
    paths:
      - "intake/schemas.py"
      - "intake/assistant.py"
      - "intake/summarize.py"
      - ".github/workflows/prompt-parity.yml"
      - ".github/workflows/prompt_parity.py"
  schedule:
    # Daily, so a change made in the other repo is noticed within a day even
    # though nothing here was pushed.
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: The lecture prompt must match syllabus-accounts
        run: |
          set -euo pipefail
          # Compares against syllabus-accounts' main. The untrusted-data paragraphs
          # and the transcript fence land in both repos in one release; while that
          # main does not have them yet the script warns and skips those checks.
          # Once both have them, any difference fails.
          for f in prompts assistant; do
            URL=https://raw.githubusercontent.com/SyllabusAI/syllabus-accounts/main/src/$f.ts
            if ! curl -fsSL -o /tmp/$f.ts "$URL"; then
              echo "::error::could not fetch $URL. If it moved or the repo went private,"
              echo "::error::update this workflow and .github/workflows/prompt_parity.py in both repos."
              exit 1
            fi
          done
          python3 .github/workflows/prompt_parity.py intake/schemas.py /tmp/prompts.ts \
            intake/assistant.py /tmp/assistant.ts intake/summarize.py
