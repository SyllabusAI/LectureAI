# Build the static LGPL ffmpeg that ships inside Syllabus.app, on an Apple
# silicon runner, and publish it as a GitHub Release when asked.
#
# Every push that touches the build recipe runs the build and keeps the
# result as a workflow artifact, so a change can be checked before it is
# published. Publishing is a manual run from main with "publish" ticked: it
# creates the release named in packaging/ffmpeg/release and attaches the
# tarball and its checksum. packaging/build.sh downloads exactly that file.
name: ffmpeg for Syllabus.app

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish as a GitHub Release (main only)"
        type: boolean
        default: false
  push:
    paths:
      - "packaging/ffmpeg/**"
      - ".github/workflows/ffmpeg.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15  # Apple silicon
    steps:
      - uses: actions/checkout@v4

      - name: Build ffmpeg and ffprobe
        run: packaging/ffmpeg/build.sh "$RUNNER_TEMP/ffmpeg"

      - name: Package
        id: package
        env:
          COPYFILE_DISABLE: "1"
        run: |
          set -euo pipefail
          eval "$(sed 's/^/PIN_/' packaging/ffmpeg/release)"
          cd "$RUNNER_TEMP/ffmpeg"
          tar -czf "$PIN_asset" ffmpeg ffprobe LICENSE.md COPYING.LGPLv2.1 BUILD.txt
          shasum -a 256 "$PIN_asset" | tee "$PIN_asset.sha256"
          echo "asset=$PIN_asset" >> "$GITHUB_OUTPUT"
          echo "tag=$PIN_tag" >> "$GITHUB_OUTPUT"
          ./ffmpeg -hide_banner -version | head -1

      - name: Keep the result
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.asset }}
          path: |
            ${{ runner.temp }}/ffmpeg/${{ steps.package.outputs.asset }}
            ${{ runner.temp }}/ffmpeg/${{ steps.package.outputs.asset }}.sha256
          if-no-files-found: error

      - name: Publish as a release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.package.outputs.tag }}
          ASSET: ${{ steps.package.outputs.asset }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; bump the tag in packaging/ffmpeg/release first" >&2
            exit 1
          fi
          cd "$RUNNER_TEMP/ffmpeg"
          VERSION="$(cat "$GITHUB_WORKSPACE/packaging/ffmpeg/VERSION")"
          gh release create "$TAG" "$ASSET" "$ASSET.sha256" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false \
            --title "ffmpeg $VERSION for Syllabus.app" \
            --notes "$(printf 'Static ffmpeg and ffprobe for Apple silicon, built from the ffmpeg %s release by packaging/ffmpeg/build.sh with GPL and nonfree parts disabled. LGPL 2.1; license texts are in the tarball. This is a build input for Syllabus.app, not something to install by hand.\n\nsha256: %s' "$VERSION" "$(cut -d' ' -f1 "$ASSET.sha256")")"
