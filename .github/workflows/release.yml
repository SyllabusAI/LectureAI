# Build Syllabus.app and its disk image, and publish them as a GitHub Release.
#
# Pushing a tag vX.Y.Z that matches intake.__version__ builds one universal
# app that runs natively on Apple silicon and on Intel Macs, wraps it in
# Syllabus-X.Y.Z.dmg, and creates the release with the image and its
# checksum attached. The app's update notice (intake/updates.py) reads that
# list. A manual run builds everything and keeps the image as a workflow
# artifact without publishing, so the recipe can be checked first; a manual
# run from a branch other than main stops before the `build` job, which only
# main and v* tags may reach (the `release` environment's rule), and still
# shows whether the universal app builds and runs on both kinds of Mac.
#
# Universal, in five jobs (packaging/universal.py says why not PyInstaller's
# own universal2 mode):
#   resolve    one exact Python and one version of every package, picked on
#              Intel (packaging/pins.py), for both builds
#   bundle     the app built twice by packaging/build.sh, natively: on Apple
#              silicon (macos-15) and on Intel (macos-15-intel), each one
#              self-tested on the Mac it was built on
#   universal  the two joined with lipo by packaging/universal.py, which fails
#              if their file lists or anything but compiled code differ, then
#              checked: every Mach-O has both slices
#   intel      the joined app's Intel slice run on a real Intel Mac
#   build      Sparkle, signing, notarization, the disk image, the release
#
# Signing: when the Developer ID and App Store Connect secrets exist
# (docs/signing.md lists them), the app is signed inside out by
# packaging/sign.sh, notarized and stapled, then the disk image is signed,
# notarized and stapled too, and Gatekeeper is asked to accept both. With
# SPARKLE_ED_PRIVATE_KEY as well, the app carries Sparkle and the release gets
# an EdDSA-signed appcast.xml. With none of them the build is exactly the
# unsigned one: signed ad hoc, a notice in the log, and release notes that
# carry the Gatekeeper steps. Some of a set but not all fails the run, so a
# typo in a secret name cannot quietly ship an unsigned release.
#
# Nothing is published until the suites pass. The `tests` job below is the
# same set CI runs on a pull request, repeated here because a tag can point at
# any commit, including one that never went through a PR, and the app's update
# notice sends people straight to whatever this publishes.
name: Release Syllabus.app

on:
  push:
    tags: ["v*"]
    paths-ignore: []
  workflow_dispatch:

permissions:
  contents: write

env:
  # The minor version both builds use; `resolve` settles the exact release.
  PYTHON_VERSION: "3.12"
  # A pinned ffmpeg that is not published yet (packaging/ffmpeg/release with
  # no sha256) is built from source instead, but only on a run that cannot
  # publish. A tag always gets the pinned, checksummed one or fails.
  SYLLABUS_FFMPEG_BUILD_UNPINNED: ${{ startsWith(github.ref, 'refs/tags/v') && '0' || '1' }}

jobs:
  # A gate, not a duplicate of CI: this runs on the macOS runner the app is
  # actually built on, and it is what `build` waits for. macOS ships lsof at
  # /usr/sbin/lsof, but the runner image does not ship ffmpeg, so the step
  # below fetches it.
  tests:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # `transcribe.duration_seconds` shells out to ffprobe, which the runner
      # image does not carry: on 2026-09-19 that failed three assertions across
      # test_gui and test_record and held back the 0.3.0 release, while the same
      # suites passed on a Mac. Take the build the .app itself bundles, pinned
      # and checksummed in packaging/ffmpeg/release, rather than brew: it is the
      # binary users actually get, so the gate cannot pass against a different
      # ffmpeg than the one it is guarding.
      - name: ffmpeg and ffprobe, the build the app bundles
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/ffmpeg"
          packaging/ffmpeg/fetch.sh "$DIR"
          echo "$DIR" >> "$GITHUB_PATH"
          "$DIR/ffprobe" -version | head -1

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Tests
        run: |
          set -uo pipefail
          failed=()
          for suite in test_*.py; do
            python "$suite" || failed+=("$suite")
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::not publishing: ${#failed[@]} suite(s) failed: ${failed[*]}"
            exit 1
          fi

  # The two builds are joined file by file, so they must agree on everything
  # but compiled code: the same Python release and the same version of every
  # package. Resolved on Intel because that side has fewer wheels (cryptography
  # 49 and later publish none for Intel Macs); packaging/pins.py says more.
  resolve:
    runs-on: macos-15-intel
    timeout-minutes: 10
    outputs:
      python: ${{ steps.python.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: The exact Python
        id: python
        run: echo "version=$(python -c 'import platform; print(platform.python_version())')" >> "$GITHUB_OUTPUT"
      - name: One version of every package
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python packaging/pins.py > "$RUNNER_TEMP/pins.txt"
          cat "$RUNNER_TEMP/pins.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pins
          path: ${{ runner.temp }}/pins.txt
          if-no-files-found: error

  bundle:
    needs: resolve
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-15        # Apple silicon
          - arch: x86_64
            runner: macos-15-intel  # Intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ needs.resolve.outputs.python }}

      - name: This runner and its Python are ${{ matrix.arch }}
        run: |
          set -euo pipefail
          echo "uname: $(uname -m); python: $(python -c 'import platform; print(platform.machine())')"
          [[ "$(python -c 'import platform; print(platform.machine())')" == "${{ matrix.arch }}" ]]

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pins
          path: ${{ runner.temp }}

      - name: Install the pinned packages and the app
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --prefer-binary -r "$RUNNER_TEMP/pins.txt"
          python -m pip install --no-deps -e .
          python -m pip check

      - name: ffmpeg and ffprobe
        run: packaging/ffmpeg/fetch.sh packaging/build/ffmpeg

      # No Sparkle and no signing here: both happen once, to the joined app,
      # in the `build` job, the only one that can read the secrets.
      - name: Build Syllabus.app for ${{ matrix.arch }}
        env:
          PYTHON: python
          SYLLABUS_DIST: dist/${{ matrix.arch }}
        run: packaging/build.sh

      - name: It runs on this Mac
        run: |
          INTAKE_HOME="$RUNNER_TEMP/home" \
            "dist/${{ matrix.arch }}/Syllabus.app/Contents/MacOS/Syllabus" --self-test ${{ matrix.arch }}

      # An artifact upload drops symlinks and permissions, which the bundle
      # needs, so it travels as a tarball.
      - name: Pack
        run: tar -C "dist/${{ matrix.arch }}" -czf "$RUNNER_TEMP/Syllabus-${{ matrix.arch }}.tar.gz" Syllabus.app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-${{ matrix.arch }}
          path: ${{ runner.temp }}/Syllabus-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  universal:
    needs: [resolve, bundle]
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ needs.resolve.outputs.python }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: app-*
          path: ${{ runner.temp }}/apps
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pins
          path: ${{ runner.temp }}

      # universal.py reads the Python packed into each main executable with
      # PyInstaller's own reader, the same version that packed it.
      - name: PyInstaller, to read the two builds
        run: python -m pip install "$(grep -i '^pyinstaller==' "$RUNNER_TEMP/pins.txt")"

      - name: Join the two builds
        run: |
          set -euo pipefail
          for arch in arm64 x86_64; do
            mkdir -p "$RUNNER_TEMP/$arch"
            tar -C "$RUNNER_TEMP/$arch" -xzf "$RUNNER_TEMP/apps/Syllabus-$arch.tar.gz"
          done
          python packaging/universal.py merge \
            "$RUNNER_TEMP/arm64/Syllabus.app" "$RUNNER_TEMP/x86_64/Syllabus.app" dist/Syllabus.app

      - name: Every Mach-O has an arm64 and an x86_64 slice
        run: python packaging/universal.py check dist/Syllabus.app

      - name: The arm64 slice runs on Apple silicon
        run: INTAKE_HOME="$RUNNER_TEMP/home" dist/Syllabus.app/Contents/MacOS/Syllabus --self-test arm64

      # The size people download, before signing adds a few kilobytes.
      - name: Size
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/preview"
          packaging/dmg.sh dist/Syllabus.app "$RUNNER_TEMP/preview" >/dev/null
          {
            echo "### Universal Syllabus.app"
            echo "- app: $(du -sh dist/Syllabus.app | cut -f1)"
            echo "- disk image: $(du -h "$RUNNER_TEMP"/preview/Syllabus-*.dmg | cut -f1)"
            echo "- arm64 build alone: $(tar -tzvf "$RUNNER_TEMP/apps/Syllabus-arm64.tar.gz" | awk '{s+=$5} END {printf "%.0fM", s/1048576}')"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Pack
        run: tar -C dist -czf "$RUNNER_TEMP/Syllabus-universal.tar.gz" Syllabus.app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-universal
          path: ${{ runner.temp }}/Syllabus-universal.tar.gz
          if-no-files-found: error
          retention-days: 7

  # The joined app on a real Intel Mac: the x86_64 slice of every file, the
  # Python packed into the arm64 slice (the bootloader reads the archive at the
  # end of the file), and the Intel ffmpeg.
  intel:
    needs: universal
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: app-universal
          path: ${{ runner.temp }}
      - name: The x86_64 slice runs on Intel
        run: |
          set -euo pipefail
          echo "$(uname -m), $(sysctl -n machdep.cpu.brand_string), macOS $(sw_vers -productVersion)"
          [[ "$(uname -m)" == x86_64 ]]
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/Syllabus-universal.tar.gz"
          APP="$RUNNER_TEMP/Syllabus.app"
          codesign --verify --deep --strict "$APP"
          INTAKE_HOME="$RUNNER_TEMP/home" arch -x86_64 "$APP/Contents/MacOS/Syllabus" --self-test x86_64

  build:
    needs: [tests, universal, intel]
    # Only main and v* tags may use the `release` environment; a branch run
    # ends with `intel` rather than failing here.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15  # Apple silicon
    # The signing and Sparkle secrets live on the `release` environment, not
    # the repository, so only this job can read them and only when the
    # environment's rules allow: a required reviewer, and runs from `main` or
    # a `v*` tag alone (docs/signing.md). A workflow edited on another branch,
    # or a tag pushed on an unreviewed commit, gets no key to sign with.
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # The app itself was built by `bundle` and `universal`; this job needs
      # the package only for its version and packaging/appcast.py.
      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: The tag must be the package's version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import intake; print(intake.__version__)')"
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" != "v$VERSION" ]]; then
            echo "tag $TAG does not match intake.__version__ $VERSION; bump intake/__init__.py first" >&2
            exit 1
          fi

      # Which of signing and Sparkle this run does, decided once from which
      # secrets exist. The secrets are only visible to this step and to the
      # steps that use them, never to the job as a whole.
      - name: Signing, notarization, and Sparkle, if configured
        id: gates
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          have=() missing=()
          for name in MACOS_CERT_P12 MACOS_CERT_PASSWORD ASC_API_KEY_ID ASC_API_ISSUER_ID ASC_API_KEY_P8; do
            if [[ -n "${!name}" ]]; then have+=("$name"); else missing+=("$name"); fi
          done
          if [[ ${#have[@]} -eq 0 ]]; then
            signing=false
            echo "::notice title=Unsigned build::No Developer ID secrets on this repository, so Syllabus.app is signed ad hoc and not notarized, as before. docs/signing.md lists what to add."
          elif [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error title=Signing half configured::have ${have[*]}; missing ${missing[*]}. Add the rest (docs/signing.md) or remove these to build unsigned."
            exit 1
          else
            signing=true
            echo "::notice title=Signed build::Developer ID signing and notarization are on."
          fi
          sparkle=false
          if [[ -n "$SPARKLE_ED_PRIVATE_KEY" ]]; then
            if [[ "$signing" != true ]]; then
              echo "::error title=Sparkle without signing::SPARKLE_ED_PRIVATE_KEY is set but Developer ID signing is not. Sparkle updates need a signed, notarized app."
              exit 1
            fi
            sparkle=true
            echo "::notice title=Sparkle::Self-update is on; the release gets an EdDSA-signed appcast.xml."
          fi
          echo "signing=$signing" >> "$GITHUB_OUTPUT"
          echo "sparkle=$sparkle" >> "$GITHUB_OUTPUT"

      # Derived from the private key rather than kept as a second secret, so
      # the two can never disagree (a mismatch would make every update fail
      # its signature check on every Mac).
      - name: Sparkle public key
        id: sparkle_key
        if: steps.gates.outputs.sparkle == 'true'
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          python -m pip install --quiet cryptography
          echo "public=$(python packaging/appcast.py --public-key-from-env SPARKLE_ED_PRIVATE_KEY)" >> "$GITHUB_OUTPUT"

      - name: The universal app
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: app-universal
          path: ${{ runner.temp }}
      - name: Unpack
        run: |
          mkdir -p dist
          tar -C dist -xzf "$RUNNER_TEMP/Syllabus-universal.tar.gz"

      # The framework and its Info.plist keys, added once to the joined app.
      # Sparkle.framework ships with both slices already.
      - name: Add Sparkle
        if: steps.gates.outputs.sparkle == 'true'
        env:
          SYLLABUS_SPARKLE_PUBLIC_KEY: ${{ steps.sparkle_key.outputs.public }}
        run: packaging/sparkle.sh dist/Syllabus.app

      # A throwaway keychain holding only the Developer ID certificate. The
      # runner is discarded after the job, and the last step deletes it anyway.
      - name: Import the Developer ID certificate
        id: keychain
        if: steps.gates.outputs.signing == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          IDENTITY: ${{ vars.SYLLABUS_CODESIGN_IDENTITY }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KC_PASS="$(openssl rand -base64 24)"
          echo "::add-mask::$KC_PASS"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KEYCHAIN" >/dev/null
          existing=()
          while IFS= read -r kc; do existing+=("$kc"); done < <(security list-keychains -d user | tr -d ' "')
          security list-keychains -d user -s "$KEYCHAIN" "${existing[@]}"
          # The identity: the variable if set, else the one Developer ID
          # Application identity in the certificate.
          if [[ -z "$IDENTITY" ]]; then
            IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
              | awk -F'"' '/Developer ID Application/ { print $2; exit }')"
          fi
          if [[ -z "$IDENTITY" ]]; then
            security find-identity -v -p codesigning "$KEYCHAIN"
            echo "::error::MACOS_CERT_P12 holds no Developer ID Application identity (docs/signing.md)"
            exit 1
          fi
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "keychain=$KEYCHAIN" >> "$GITHUB_OUTPUT"
          echo "signing as: $IDENTITY"

      - name: Sign Syllabus.app with Developer ID
        if: steps.gates.outputs.signing == 'true'
        env:
          SYLLABUS_KEYCHAIN: ${{ steps.keychain.outputs.keychain }}
          IDENTITY: ${{ steps.keychain.outputs.identity }}
        run: packaging/sign.sh dist/Syllabus.app "$IDENTITY" packaging/entitlements.plist

      # The App Store Connect API key, written once for both notarizations.
      - name: App Store Connect key for notarytool
        id: asc
        if: steps.gates.outputs.signing == 'true'
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/AuthKey_${ASC_API_KEY_ID}.p8"
          printf '%s\n' "$ASC_API_KEY_P8" > "$KEY"
          chmod 600 "$KEY"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      # The app is notarized and stapled on its own first, so a copy dragged
      # out of the image passes Gatekeeper offline too, not only the image.
      - name: Notarize and staple Syllabus.app
        if: steps.gates.outputs.signing == 'true'
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_PATH: ${{ steps.asc.outputs.key }}
        run: packaging/notarize.sh dist/Syllabus.app

      # The app as it will ship, signed or ad hoc: still both slices in every
      # Mach-O (lipo -archs on each), and the Apple silicon slice still runs.
      - name: Every Mach-O in the final app has an arm64 and an x86_64 slice
        run: |
          set -euo pipefail
          python packaging/universal.py check dist/Syllabus.app
          INTAKE_HOME="$RUNNER_TEMP/home" dist/Syllabus.app/Contents/MacOS/Syllabus --self-test arm64

      - name: Build the disk image
        id: dmg
        run: |
          set -euo pipefail
          packaging/dmg.sh dist/Syllabus.app dist
          DMG="$(ls dist/Syllabus-*.dmg)"
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$DMG")" >> "$GITHUB_OUTPUT"

      - name: Sign, notarize, and staple the disk image
        if: steps.gates.outputs.signing == 'true'
        env:
          SYLLABUS_KEYCHAIN: ${{ steps.keychain.outputs.keychain }}
          IDENTITY: ${{ steps.keychain.outputs.identity }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_PATH: ${{ steps.asc.outputs.key }}
          DMG: ${{ steps.dmg.outputs.dmg }}
        run: |
          set -euo pipefail
          codesign --force --sign "$IDENTITY" --timestamp --keychain "$SYLLABUS_KEYCHAIN" "$DMG"
          packaging/notarize.sh "$DMG"
          # Stapling changed the file, so the checksum dmg.sh wrote is stale.
          (cd "$(dirname "$DMG")" && shasum -a 256 "$(basename "$DMG")" > "$(basename "$DMG").sha256")
          cat "$DMG.sha256"

      # What a person's Mac will decide, asked of this runner's Gatekeeper.
      - name: Gatekeeper accepts the app and the image
        if: steps.gates.outputs.signing == 'true'
        env:
          DMG: ${{ steps.dmg.outputs.dmg }}
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 dist/Syllabus.app
          xcrun stapler validate dist/Syllabus.app
          xcrun stapler validate "$DMG"
          spctl --assess --type execute --verbose=4 dist/Syllabus.app
          spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG"

      - name: Sparkle appcast
        if: steps.gates.outputs.sparkle == 'true'
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          DMG: ${{ steps.dmg.outputs.dmg }}
        run: |
          set -euo pipefail
          eval "$(sed 's/^/SPK_/' packaging/sparkle/release)"
          BIN="packaging/build/sparkle-$SPK_version/bin"
          VERSION="$(python -c 'import intake; print(intake.__version__)')"
          KEYFILE="$RUNNER_TEMP/sparkle_ed.key"
          ( umask 077; printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$KEYFILE" )
          SIG="$("$BIN/sign_update" --ed-key-file "$KEYFILE" -p "$DMG")"
          rm -f "$KEYFILE"
          python packaging/appcast.py --version "$VERSION" --dmg "$DMG" \
            --signature "$SIG" --repo "$GITHUB_REPOSITORY" --out dist/appcast.xml
          cat dist/appcast.xml

      - name: Keep the result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.dmg.outputs.name }}
          path: |
            ${{ steps.dmg.outputs.dmg }}
            ${{ steps.dmg.outputs.dmg }}.sha256
          if-no-files-found: error

      - name: Keep the appcast
        if: steps.gates.outputs.sparkle == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: appcast.xml
          path: dist/appcast.xml
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          DMG: ${{ steps.dmg.outputs.dmg }}
          SIGNED: ${{ steps.gates.outputs.signing }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          {
            if [[ "$SIGNED" == true ]]; then
              # A signed build opens without the Gatekeeper detour, so the
              # paragraph explaining it goes (test_sparkle.py pins the phrase).
              sed "s/{{version}}/$VERSION/g; s/{{dmg}}/$(basename "$DMG")/g" packaging/release-notes.md \
                | grep -v "not yet signed with an Apple Developer ID" | cat -s
            else
              sed "s/{{version}}/$VERSION/g; s/{{dmg}}/$(basename "$DMG")/g" packaging/release-notes.md
            fi
            echo
            echo "sha256: $(cut -d' ' -f1 "$DMG.sha256")"
          } > "$RUNNER_TEMP/notes.md"
          assets=("$DMG" "$DMG.sha256")
          # Present only when Sparkle is on; the app's feed URL is
          # releases/latest/download/appcast.xml.
          [[ -f dist/appcast.xml ]] && assets+=(dist/appcast.xml)
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" --title "Syllabus $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" --generate-notes

      - name: Remove the signing keychain
        if: always() && steps.keychain.outputs.keychain != ''
        env:
          KEYCHAIN: ${{ steps.keychain.outputs.keychain }}
        run: |
          security delete-keychain "$KEYCHAIN" || true
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8
