[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intake"
description = "Record a lecture, transcribe it, summarize it with Claude, file it in Drive."
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "openai>=1.60",
    "anthropic>=0.40",
    "google-api-python-client>=2.150",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
    "flask>=3.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "watchdog>=5.0",
    "websocket-client>=1.8",
]

# The desktop app (intake/app.py) and the tooling that freezes it into
# Syllabus.app (packaging/). Neither is needed for the command line install.
[project.optional-dependencies]
app = ["pywebview>=6.0", "pyobjc-framework-EventKit>=10.0; sys_platform == 'darwin'"]
# Apple Calendar and Apple Reminders through EventKit, for a command line
# install: pipx install 'intake[calendar] @ git+...'. Without it Apple Calendar
# falls back to AppleScript and Reminders is unavailable. Google Calendar
# needs nothing extra. 10.0 is the first release with macOS 14's full-access
# requests.
calendar = ["pyobjc-framework-EventKit>=10.0; sys_platform == 'darwin'"]
build = ["pyinstaller>=6.10"]

[project.scripts]
intake = "intake.cli:main"
# The same entry point with the profile chosen: syllabus for lectures, sous
# for client calls. `sous record` is `intake --profile sous record`.
syllabus = "intake.cli:syllabus"
sous = "intake.cli:sous"
# The command's name before the rename: the same entry point, kept for now so
# nothing that still says `lectureai` breaks. Drop it once everything says intake.
lectureai = "intake.cli:main"

[tool.setuptools]
packages = ["intake"]

[tool.setuptools.dynamic]
version = {attr = "intake.__version__"}

# The bundled Google OAuth client and the control panel's page and images
# travel with the package. Nothing else outside the .py files is needed.
[tool.setuptools.package-data]
intake = ["credentials.json", "templates/*.html", "static/*.png"]
